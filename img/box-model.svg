<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-labelledby="t">
  <title id="t">Схема блочной модели CSS: margin, border, padding, content</title>
  <g font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#14181f">
    <rect x="4" y="4" width="312" height="252" rx="10" fill="#fde7d4" fill-opacity=".45" stroke="#14181f" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="16" y="24">margin</text>
    <rect x="36" y="36" width="248" height="188" rx="8" fill="#c2410c" stroke="#14181f" stroke-width="2"/>
    <text x="48" y="56" fill="#ffffff">border</text>
    <rect x="56" y="66" width="208" height="138" rx="6" fill="#ffe3d9" stroke="#14181f" stroke-width="2"/>
    <text x="68" y="86">padding</text>
    <rect x="96" y="102" width="128" height="70" rx="6" fill="#dbe2f0" stroke="#14181f" stroke-width="2"/>
    <text x="160" y="134" text-anchor="middle">content</text>
